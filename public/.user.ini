; Read by PHP on Apache/php-fpm hosting (per-directory PHP_INI_PERDIR overrides).
; Without this, PHP's default upload_max_filesize/post_max_size (often 2M/8M)
; silently reject or truncate PDF uploads before Laravel's own validation ever
; runs — the PDF Image Extractor tool needs headroom above that. Has no effect
; on `php artisan serve` (the CLI SAPI doesn't read .user.ini); that's set
; directly in its php.ini for local dev.
upload_max_filesize = 32M
post_max_size = 34M
memory_limit = 256M
max_execution_time = 120
